<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Keuangan Pribadi</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16a34a">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f0fdf4;
    padding:15px;
}

.card{
    max-width:550px;
    margin:auto;
    background:#fff;
    padding:20px;
    border-radius:16px;
    box-shadow:0 4px 12px rgba(0,0,0,.1);
}

h1{
    text-align:center;
    color:#16a34a;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:20px;
}

.dashboard{
    display:grid;
    gap:10px;
    margin-bottom:20px;
}

.box{
    padding:15px;
    border-radius:12px;
    text-align:center;
    color:#fff;
}

.box h3{
    margin-bottom:5px;
}

.box p{
    font-size:26px;
    font-weight:bold;
}

.saldo{
    background:#16a34a;
}

.masuk{
    background:#2563eb;
}

.keluar{
    background:#dc2626;
}

label{
    display:block;
    margin-top:12px;
    margin-bottom:5px;
    font-weight:bold;
}

input,
select{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

button{
    width:100%;
    margin-top:20px;
    padding:14px;
    border:none;
    border-radius:8px;
    background:#16a34a;
    color:#fff;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#15803d;
}

#status{
    margin-top:15px;
    text-align:center;
    font-weight:bold;
}
</style>

</head>
<body>

<div class="card">

<h1>💰 Keuangan Pribadi</h1>

<p class="subtitle">
Catat pemasukan dan pengeluaran harian
</p>

<div class="dashboard">

<div class="box saldo">
    <h3>💰 Saldo</h3>
    <p id="saldo">Rp 0</p>
</div>

<div class="box masuk">
    <h3>📈 Total Pemasukan</h3>
    <p id="totalMasuk">Rp 0</p>
</div>

<div class="box keluar">
    <h3>📉 Total Pengeluaran</h3>
    <p id="totalKeluar">Rp 0</p>
</div>

</div>

<form id="formKeuangan">

<label>Tanggal</label>
<input type="date" id="tanggal" required>

<label>Jenis Transaksi</label>
<select id="jenis">
    <option value="Masuk">Pemasukan</option>
    <option value="Keluar">Pengeluaran</option>
</select>

<label>Kategori</label>
<select id="kategori">
    <option value="Tagihan Rumah">Tagihan Rumah</option>
    <option value="Kebutuhan Harian dan Bulanan">Kebutuhan Harian</option>
    <option value="Cicilan Rumah Kiramland">Rumah Kiramland</option>
    <option value="Keperluan Pribadi">Keperluan Pribadi</option>
    <option value="Kesehatan/Medical">Medical</option>
    <option value="Keperluan Bayi">Baby Shop</option>
</select>

<label>Deskripsi</label>
<input type="text" id="deskripsi">

<label>Nominal (Rp)</label>
<input type="number" id="nominal" required>

<button type="submit" id="btnSimpan">
Simpan Transaksi
</button>

</form>

<div id="status"></div>

</div>

<script>

// GANTI DENGAN URL APPS SCRIPT TERBARU
const API_URL = "https://script.google.com/macros/s/AKfycbwQY2lV0EpSWmvjAtIX3FBpRjLDuqwHer6meXg_0pLyo_SJIt4aOXC1sIT80uMvG23X/exec";

function rupiah(n){
    return "Rp " + Number(n).toLocaleString("id-ID");
}

async function loadDashboard(){

    try{

        const response = await fetch(API_URL);

        const data = await response.json();

        let totalMasuk = 0;
        let totalKeluar = 0;

        data.forEach(item => {

            const nominal = Number(item.nominal) || 0;

            if(item.jenis === "Masuk"){
                totalMasuk += nominal;
            }

            if(item.jenis === "Keluar"){
                totalKeluar += nominal;
            }

        });

        document.getElementById("totalMasuk").textContent =
            rupiah(totalMasuk);

        document.getElementById("totalKeluar").textContent =
            rupiah(totalKeluar);

        document.getElementById("saldo").textContent =
            rupiah(totalMasuk - totalKeluar);

        console.log("Dashboard berhasil dimuat");

    }catch(err){

        console.error(err);

        document.getElementById("status").innerHTML =
        "❌ Dashboard gagal memuat data";

    }

}

document.getElementById("tanggal").value =
new Date().toISOString().split("T")[0];

document.getElementById("formKeuangan")
.addEventListener("submit", async function(e){

    e.preventDefault();

    const data = {
        tanggal: document.getElementById("tanggal").value,
        jenis: document.getElementById("jenis").value,
        kategori: document.getElementById("kategori").value,
        deskripsi: document.getElementById("deskripsi").value,
        nominal: document.getElementById("nominal").value
    };

    try{

        await fetch(API_URL,{
            method:"POST",
            mode:"no-cors",
            headers:{
                "Content-Type":"text/plain"
            },
            body:JSON.stringify(data)
        });

        document.getElementById("status").innerHTML =
        "✅ Data berhasil disimpan";

        document.getElementById("deskripsi").value="";
        document.getElementById("nominal").value="";

        setTimeout(loadDashboard,1500);

    }catch(err){

        document.getElementById("status").innerHTML =
        "❌ Gagal menyimpan data";

    }

});

loadDashboard();

if("serviceWorker" in navigator){
    navigator.serviceWorker.register("./sw.js");
}

</script>

</body>
</html>
