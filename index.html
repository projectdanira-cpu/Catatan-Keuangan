<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Keuangan Pribadi</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16a34a">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f0fdf4;
    padding:15px;
}

.card{
    max-width:500px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:16px;
    box-shadow:0 4px 12px rgba(0,0,0,.1);
}

h1{
    text-align:center;
    color:#16a34a;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:20px;
}

.dashboard{
    margin-bottom:20px;
}

.box{
    padding:15px;
    border-radius:12px;
    margin-bottom:10px;
    text-align:center;
    color:white;
}

.box h3{
    margin-bottom:5px;
}

.box p{
    font-size:24px;
    font-weight:bold;
}

.saldo{
    background:#16a34a;
}

.masuk{
    background:#2563eb;
}

.keluar{
    background:#dc2626;
}

label{
    display:block;
    margin-top:12px;
    margin-bottom:5px;
    font-weight:bold;
}

input,
select{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

button{
    width:100%;
    margin-top:20px;
    padding:14px;
    border:none;
    border-radius:8px;
    background:#16a34a;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#15803d;
}

button:disabled{
    background:#999;
}

#status{
    margin-top:15px;
    text-align:center;
    font-weight:bold;
}

.loading{
    color:#2563eb;
}
</style>
</head>

<body>

<div class="card">

<h1>💰 Keuangan Pribadi</h1>

<p class="subtitle">
Catat pemasukan dan pengeluaran harian
</p>

<div class="dashboard">

<div class="box saldo">
<h3>💰 Saldo</h3>
<p id="saldo">Rp 0</p>
</div>

<div class="box masuk">
<h3>📈 Total Pemasukan</h3>
<p id="totalMasuk">Rp 0</p>
</div>

<div class="box keluar">
<h3>📉 Total Pengeluaran</h3>
<p id="totalKeluar">Rp 0</p>
</div>

</div>

<form id="formKeuangan">

<label>Tanggal</label>
<input type="date" id="tanggal" required>

<label>Jenis Transaksi</label>
<select id="jenis">
    <option value="Masuk">Pemasukan</option>
    <option value="Keluar">Pengeluaran</option>
</select>

<label>Kategori</label>
<select id="kategori">
    <option value="Tagihan Rumah">Tagihan Rumah</option>
    <option value="Kebutuhan Harian dan Bulanan">Kebutuhan H&B</option>
    <option value="Cicilan Rumah Kiramland">Rumah Kiramland</option>
    <option value="Keperluan Pribadi">Keperluan Pribadi</option>
    <option value="Kesehatan/Medical">Medical</option>
    <option value="Keperluan Bayi">Baby Shop</option>
</select>

<label>Deskripsi</label>
<input type="text" id="deskripsi" placeholder="Keterangan transaksi">

<label>Nominal (Rp)</label>
<input type="number" id="nominal" required>

<button type="submit" id="btnSimpan">
Simpan Transaksi
</button>

</form>

<div id="status"></div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwQY2lV0EpSWmvjAtIX3FBpRjLDuqwHer6meXg_0pLyo_SJIt4aOXC1sIT80uMvG23X/exec";

let totalMasuk = 0;
let totalKeluar = 0;

function formatRupiah(nilai){
    return "Rp " + nilai.toLocaleString("id-ID");
}

function updateDashboard(){

    document.getElementById("totalMasuk").textContent =
        formatRupiah(totalMasuk);

    document.getElementById("totalKeluar").textContent =
        formatRupiah(totalKeluar);

    document.getElementById("saldo").textContent =
        formatRupiah(totalMasuk - totalKeluar);
}

async function loadDashboard(){

    try{

        const response = await fetch(API_URL);
        const data = await response.json();

        totalMasuk = 0;
        totalKeluar = 0;

        data.forEach(item=>{

            const nominal = Number(item.nominal) || 0;

            if(item.jenis === "Masuk"){
                totalMasuk += nominal;
            }

            if(item.jenis === "Keluar"){
                totalKeluar += nominal;
            }

        });

        updateDashboard();

    }catch(error){

        console.error(error);

        document.getElementById("status").innerHTML =
            "❌ Dashboard gagal memuat data";

    }

}

document.getElementById("tanggal").value =
new Date().toISOString().split("T")[0];

document.getElementById("formKeuangan")
.addEventListener("submit", async function(e){

    e.preventDefault();

    const btn = document.getElementById("btnSimpan");
    const status = document.getElementById("status");

    btn.disabled = true;
    btn.textContent = "Menyimpan...";

    const data = {
        tanggal: document.getElementById("tanggal").value,
        jenis: document.getElementById("jenis").value,
        kategori: document.getElementById("kategori").value,
        deskripsi: document.getElementById("deskripsi").value,
        nominal: document.getElementById("nominal").value
    };

    try{

        await fetch(API_URL,{
            method:"POST",
            mode:"no-cors",
            headers:{
                "Content-Type":"text/plain"
            },
            body:JSON.stringify(data)
        });

        status.innerHTML =
            "✅ Data berhasil disimpan";

        document.getElementById("deskripsi").value = "";
        document.getElementById("nominal").value = "";

        setTimeout(loadDashboard,2000);

    }catch(error){

        status.innerHTML =
            "❌ Gagal menyimpan data";

        console.error(error);

    }

    btn.disabled = false;
    btn.textContent = "Simpan Transaksi";

});

loadDashboard();

if("serviceWorker" in navigator){
    window.addEventListener("load",function(){
        navigator.serviceWorker.register("./sw.js");
    });
}

</script>

</body>
</html>
